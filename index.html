<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>专业批发商城 | 高效采购，品质保障</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 顶部导航栏 -->
  <header class="header">
    <div class="container">
      <div class="logo">
        <img src="images/logo.jpg" alt="Brand Logo" width="140" />
      </div>
      <div class="search-bar">
        <input type="text" placeholder="搜索商品名称或编号..." />
        <button>搜索</button>
      </div>
      <div class="cart-icon">
        <span>🛒</span>
        <span class="badge">0</span>
      </div>
    </div>
  </header>

  <!-- 轮播图区域 -->
  <section class="hero">
    <div class="container">
      <div class="carousel">
        <div class="slide active">
          <img src="https://picsum.photos/id/1/1200/400" alt="限时促销" loading="lazy" />
          <div class="slide-content">
            <h2>🔥 限时促销：全场低至 5 折</h2>
            <p>立即采购，节省成本，提升利润</p>
            <button class="btn">立即抢购</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 商品分类筛选器 -->
  <section class="filters">
    <div class="container">
      <h3>商品分类</h3>
      <div class="filter-buttons">
        <button class="filter-btn active">全部</button>
        <button class="filter-btn">电子产品</button>
        <button class="filter-btn">日用百货</button>
        <button class="filter-btn">包装材料</button>
        <button class="filter-btn">食品原料</button>
      </div>
    </div>
  </section>

  <!-- 商品列表 -->
  <section class="products">
    <div class="container">
      <h2>精选批发商品</h2>
      <div class="product-grid">
        <!-- 商品卡片 1 -->
        <div class="product-card" data-id="1">
          <div class="new-tag">新品</div>
          <img src="https://picsum.photos/id/20/300/200" alt="智能手环" loading="lazy" />
          <h3 class="product-name">智能手环 X10</h3>
          <p class="product-code">P001234</p>
        </div>

        <!-- 商品卡片 2 -->
        <div class="product-card" data-id="2">
          <div class="new-tag">新品</div>
          <img src="https://picsum.photos/id/21/300/200" alt="不锈钢保温杯" loading="lazy" />
          <h3 class="product-name">不锈钢保温杯 500ml</h3>
          <p class="product-code">P005678</p>
        </div>

        <!-- 商品卡片 3 -->
        <div class="product-card" data-id="3">
          <div class="new-tag">新品</div>
          <img src="https://picsum.photos/id/22/300/200" alt="环保购物袋" loading="lazy" />
          <h3 class="product-name">环保可重复使用购物袋</h3>
          <p class="product-code">P009876</p>
        </div>

        <!-- 商品卡片 4 -->
        <div class="product-card" data-id="4">
          <img src="https://picsum.photos/id/23/300/200" alt="塑料收纳盒" loading="lazy" />
          <h3 class="product-name">多层塑料收纳盒</h3>
          <p class="product-code">P003456</p>
        </div>

        <!-- 商品卡片 5 -->
        <div class="product-card" data-id="5">
          <div class="new-tag">新品</div>
          <img src="https://picsum.photos/id/24/300/200" alt="USB充电灯" loading="lazy" />
          <h3 class="product-name">便携USB充电灯</h3>
          <p class="product-code">P007788</p>
        </div>

        <!-- 商品卡片 6 -->
        <div class="product-card" data-id="6">
          <img src="https://picsum.photos/id/25/300/200" alt="食品保鲜盒" loading="lazy" />
          <h3 class="product-name">食品级保鲜盒套装</h3>
          <p class="product-code">P002345</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 脚本 -->
  <script src="script.js"></script>

</body>
</html>
